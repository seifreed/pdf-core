[package]
name = "pdf-sec-analyzer"
version = "0.1.1-alpha"
edition = "2021"
authors = ["Marc Rivero <mriverolopez@gmail.com>"]
description = "Security analysis library for PDF documents using PDF-AST"
license = "MIT"

[dependencies]
pdf-ast = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
