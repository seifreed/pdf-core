[workspace]
resolver = "2"
members = [
    ".",
    "pdf-compliance",
    "pdf-sec-analyzer",
    "experimental/pdf-diff",
    "experimental/pdf-text-intel",
    "python",
    "examples/dynamic_plugin",
]
exclude = ["fuzz"]

[package]
name = "pdf-ast"
version = "0.1.1-alpha"
edition = "2021"
rust-version = "1.85"
authors = ["Marc Rivero <mriverolopez@gmail.com>"]
description = "Experimental PDF AST parser for structural, forensic, and security analysis"
license = "MIT"
repository = "https://github.com/seifreed/pdf-core"
homepage = "https://github.com/seifreed/pdf-core"
keywords = ["pdf", "ast", "abstract-syntax-tree", "parsing", "security"]
categories = ["parsing", "data-structures"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0.100"
indexmap = "2.0"
petgraph = "0.6"

# Parsing
nom = "7.1"
memchr = "2.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
serde_yaml = "0.9"
toml = "0.8"

# Compression filters
flate2 = "1.0"
lzw = "0.10"

# Image filters
jpeg-decoder = "0.3"
png = "0.17"

# CCITT fax decoding (for CCITT filter)
tiff = "0.9"

# JBIG2 (basic support - would need specialized library)
# jbig2dec-rs = "0.1"  # Not available, would need custom implementation

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Async support (for lazy loading and streaming)
tokio = { version = "1.35", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }

# Performance optimizations
rayon = { version = "1.8", optional = true }
parking_lot = "0.12"
dashmap = "5.5"
bytes = "1.5"

# Cryptographic support
openssl = { version = "0.10", features = ["vendored"], optional = true }
ring = { version = "0.17", optional = true }
x509-parser = { version = "0.16", optional = true }
der-parser = { version = "9.0", optional = true }
cms = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

# Extended format support
# JBIG2 decoding is intentionally unsupported; raw streams remain inspectable.
quick-xml = "0.41"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Language bindings
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
neon = { version = "0.10", default-features = false, features = ["napi-6"], optional = true }

# System interface
libc = "0.2"

# Error recovery
regex = "1.10"
rand = "0.9"
md5 = "0.7"
sha2 = "0.10"
sha1 = "0.10"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
proptest = "1.4"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["parallel", "crypto"]
async = ["tokio", "async-trait"]
crypto = ["openssl", "ring", "x509-parser", "der-parser", "cms", "reqwest"]
# extended = ["jbig2"]
parallel = ["rayon"]
python = ["pyo3"]
javascript = ["neon"]
bindings = ["python", "javascript"]
streaming = ["async", "tokio", "async-trait"]
full = ["async", "crypto", "parallel", "bindings", "streaming"]
ring = ["dep:ring"]


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
[[bin]]
name = "debug_ast"
path = "src/bin/debug_ast.rs"

[[bin]]
name = "pdf-ast"
path = "src/bin/pdf-ast.rs"

[[bin]]
name = "pdf-ast-simple"
path = "src/bin/pdf-ast-simple.rs"

[[bin]]
name = "pdf-fuzz"
path = "src/bin/pdf-fuzz.rs"

[[bench]]
name = "parse_bench"
harness = false
