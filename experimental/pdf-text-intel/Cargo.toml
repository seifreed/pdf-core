[package]
name = "pdf-text-intel"
version = "0.1.1-alpha"
edition = "2021"
authors = ["Marc Rivero <mriverolopez@gmail.com>"]
description = "Advanced text extraction and analysis library using PDF-AST"
license = "MIT"

[dependencies]
pdf-ast = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"
