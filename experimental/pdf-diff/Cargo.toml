[package]
name = "pdf-diff"
version = "0.1.1-alpha"
edition = "2021"
authors = ["Marc Rivero <mriverolopez@gmail.com>"]
description = "PDF document comparison and diff library using PDF-AST"
license = "MIT"

[dependencies]
pdf-ast = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.3"
log = "0.4"
