[package]
name = "pdf-ast-python"
version = "0.1.0"
edition = "2021"
authors = ["Marc Rivero <mriverolopez@gmail.com>"]
description = "Python bindings for PDF-AST"
license = "MIT"

[lib]
name = "pdf_ast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pdf_ast_core = { package = "pdf-ast", path = ".." }

[build-dependencies]
pyo3-build-config = "0.29"
