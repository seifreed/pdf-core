name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  bindings:
    name: Build bindings (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            npm_package: pdf-ast-linux-x64
            npm_os: linux
            npm_cpu: x64
          - os: macos-latest
            target: macos-arm64
            npm_package: pdf-ast-darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - os: windows-latest
            target: windows-x86_64
            npm_package: pdf-ast-win32-x64
            npm_os: win32
            npm_cpu: x64
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag signature before building bindings
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        shell: bash
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$RELEASE_SIGNING_FINGERPRINT"
          key_file="$RUNNER_TEMP/release-signing-key.asc"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          gpg --batch --import "$key_file"
          actual_fingerprint=$(gpg --batch --with-colons --show-keys "$key_file" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fingerprint" = "$RELEASE_SIGNING_FINGERPRINT"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-01-01
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python wheel
        working-directory: python
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --locked --release --manifest-path Cargo.toml --out "$GITHUB_WORKSPACE/dist/python"

      - name: Build Node package
        working-directory: javascript
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build-release
          mkdir -p "$GITHUB_WORKSPACE/dist/node-package-${{ matrix.target }}"
          cp index.node "$GITHUB_WORKSPACE/dist/node-package-${{ matrix.target }}/"
          NPM_PACKAGE_DIR="$GITHUB_WORKSPACE/dist/node-package-${{ matrix.target }}" \
          NPM_PACKAGE_NAME="${{ matrix.npm_package }}" \
          NPM_OS="${{ matrix.npm_os }}" \
          NPM_CPU="${{ matrix.npm_cpu }}" \
          node <<'NODE'
          const fs = require("node:fs");
          const base = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageJson = {
            name: process.env.NPM_PACKAGE_NAME,
            version: base.version,
            description: `${base.description} native binary`,
            main: "index.node",
            license: base.license,
            repository: base.repository,
            os: [process.env.NPM_OS],
            cpu: [process.env.NPM_CPU],
            files: ["index.node"],
          };
          fs.writeFileSync(
            `${process.env.NPM_PACKAGE_DIR}/package.json`,
            `${JSON.stringify(packageJson, null, 2)}\n`,
          );
          NODE
          npm pack "$GITHUB_WORKSPACE/dist/node-package-${{ matrix.target }}" \
            --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Upload binding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: |
            dist/python/*.whl
            dist/pdf-ast-*.tgz
          if-no-files-found: error

  release:
    name: Build and attest Linux artifacts
    needs: bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import and verify release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$RELEASE_SIGNING_FINGERPRINT"
          key_file="$RUNNER_TEMP/release-signing-key.asc"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          gpg --batch --import "$key_file"
          actual_fingerprint=$(gpg --batch --with-colons --show-keys "$key_file" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fingerprint" = "$RELEASE_SIGNING_FINGERPRINT"

      - name: Verify tag signature
        run: git verify-tag "$GITHUB_REF_NAME"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-01-01
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config python3-dev

      - name: Set reproducible build metadata
        id: metadata
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Verify package versions match tag
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          manifests = [
              Path("Cargo.toml"),
              Path("python/Cargo.toml"),
              Path("javascript/package.json"),
          ]
          versions = []
          for manifest in manifests:
              if manifest.suffix == ".json":
                  versions.append(json.loads(manifest.read_text())["version"])
              else:
                  for line in manifest.read_text().splitlines():
                      if line.startswith("version = "):
                          versions.append(line.split('"')[1])
                          break
          if versions != [expected] * len(versions):
              raise SystemExit(f"release tag {expected} does not match versions {versions}")
          PY

      - name: Build Rust and C artifacts
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          cargo build --locked --release --bin pdf-ast --bin pdf-ast-simple
          mkdir -p dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64
          cp target/release/pdf-ast dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64/
          cp target/release/pdf-ast-simple dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64/
          cp target/release/libpdf_ast.a dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64/
          cp target/release/libpdf_ast.so dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64/
          cp include/pdf_ast.h LICENSE dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64/
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64.tar.gz \
            -C dist pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64

      - name: Generate CycloneDX SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5 \
            --override-filename dist/pdf-core-${{ steps.metadata.outputs.version }}-sbom.json \
            --all-features

      - name: Download binding artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: dist/bindings
          merge-multiple: true

      - name: Flatten binding artifacts
        run: |
          find dist/bindings -type f -exec cp {} dist/ \;
          rm -rf dist/bindings dist/node-package dist/python

      - name: Prepare main Node package
        shell: bash
        run: |
          mkdir -p dist/node-main
          cp javascript/index.js javascript/index.d.ts javascript/README.md dist/node-main/
          node <<'NODE'
          const fs = require("node:fs");
          const base = JSON.parse(fs.readFileSync("javascript/package.json", "utf8"));
          delete base.devDependencies;
          delete base.scripts;
          delete base.optionalDependencies;
          base.main = "index.js";
          base.optionalDependencies = {
            "pdf-ast-darwin-arm64": base.version,
            "pdf-ast-linux-x64": base.version,
            "pdf-ast-win32-x64": base.version,
          };
          base.files = ["index.js", "index.d.ts", "README.md"];
          fs.writeFileSync(
            "dist/node-main/package.json",
            `${JSON.stringify(base, null, 2)}\n`,
          );
          NODE
          npm pack dist/node-main --pack-destination dist

      - name: Publish Rust crate
        if: ${{ vars.PUBLISH_REGISTRIES == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish Python wheels
        if: ${{ vars.PUBLISH_REGISTRIES == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$PYPI_API_TOKEN"
          python -m pip install --disable-pip-version-check twine
          python -m twine upload --non-interactive --username __token__ --password "$PYPI_API_TOKEN" dist/*.whl

      - name: Publish Node packages
        if: ${{ vars.PUBLISH_REGISTRIES == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish dist/pdf-ast-darwin-arm64-*.tgz --access public
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish dist/pdf-ast-linux-x64-*.tgz --access public
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish dist/pdf-ast-win32-x64-*.tgz --access public
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish dist/pdf-ast-[0-9]*.tgz --access public

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.tgz *.whl *.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/pdf-core-${{ steps.metadata.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/pdf-core-${{ steps.metadata.outputs.version }}-sbom.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tgz dist/*.whl dist/*.json dist/SHA256SUMS --verify-tag --generate-notes
