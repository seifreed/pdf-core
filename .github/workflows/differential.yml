name: Differential Corpus

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-parsers:
    name: Compare with qpdf and MuPDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          toolchain: stable
      - name: Install reference parsers
        run: sudo apt-get update && sudo apt-get install -y qpdf mupdf-tools
      - name: Fetch pinned project corpus
        env:
          PDF_CORPUS_COMMIT: 9979a2a8618dcdf23ad3f20c760c1f06e5b36fe6
        run: tools/fetch-verapdf-corpus.sh "fixtures/verapdf-pdfa-1b" "$RUNNER_TEMP/verapdf-corpus"
      - name: Run differential corpus test
        env:
          PDF_EXTERNAL_CORPUS: ${{ runner.temp }}/verapdf-corpus
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: |
          set -o pipefail
          /usr/bin/time -v cargo test --test differential_tests --locked -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/differential.log"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-corpus-evidence
          path: ${{ runner.temp }}/differential.log
          if-no-files-found: error
