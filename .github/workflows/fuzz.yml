name: Fuzzing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  parser:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - pdf_parse
          - object_values
          - content_stream
          - filters
          - xref
          - serialization
          - object_streams
          - cmap
          - xmp
          - pkcs7
          - certificates
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-01-01
        with:
          toolchain: stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded campaign
        run: cargo fuzz run ${{ matrix.target }} -- -runs=1000
