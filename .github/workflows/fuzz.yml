name: Fuzzing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - pdf_parse
          - object_values
          - content_stream
          - filters
          - xref
          - serialization
          - object_streams
          - cmap
          - xmp
          - pkcs7
          - certificates
          - page_tree
          - lexer
          - indirect_objects
          - streams
          - xref_streams
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded campaign
        run: cargo fuzz run ${{ matrix.target }} -- -runs=1000
