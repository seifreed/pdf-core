name: Fuzzing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - pdf_parse
          - object_values
          - content_stream
          - filters
          - xref
          - serialization
          - object_streams
          - cmap
          - xmp
          - pkcs7
          - certificates
          - page_tree
          - lexer
          - indirect_objects
          - streams
          - xref_streams
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded campaign
        run: |
          artifact_dir="$RUNNER_TEMP/fuzz-artifacts"
          log_file="$RUNNER_TEMP/fuzz-${{ matrix.target }}.log"
          resource_file="$RUNNER_TEMP/fuzz-${{ matrix.target }}.resources"
          summary_file="$RUNNER_TEMP/fuzz-${{ matrix.target }}.summary"
          mkdir -p "$artifact_dir"
          set -o pipefail
          set +e
          /usr/bin/time -v -o "$resource_file" cargo fuzz run "${{ matrix.target }}" -- \
            -runs=1000 \
            -timeout=5 \
            -print_final_stats=1 \
            -artifact_prefix="$artifact_dir/" 2>&1 | tee "$log_file"
          fuzz_status=${PIPESTATUS[0]}
          set -e
          peak_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/^[[:space:]]+/, "", $2); print $2; exit}' "$resource_file")
          peak_rss_kib="${peak_rss_kib:-unknown}"
          findings=0
          if [ "$fuzz_status" -ne 0 ] || find "$artifact_dir" -type f -print -quit | grep -q .; then
            findings=1
          fi
          if [ "$findings" -eq 1 ]; then
            {
              echo "findings=$findings"
              echo "peak_rss_kib=$peak_rss_kib"
            } | tee "$summary_file"
            exit 1
          fi
          {
            echo "findings=0"
            echo "peak_rss_kib=$peak_rss_kib"
          } | tee "$summary_file"

      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.log
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.resources
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.summary
            ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: error
