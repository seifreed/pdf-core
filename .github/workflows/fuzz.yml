name: Fuzzing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parser:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - pdf_parse
          - object_values
          - content_stream
          - filters
          - xref
          - serialization
          - object_streams
          - cmap
          - xmp
          - pkcs7
          - certificates
          - page_tree
          - lexer
          - indirect_objects
          - streams
          - xref_streams
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded campaign
        run: |
          artifact_dir="$RUNNER_TEMP/fuzz-artifacts"
          log_file="$RUNNER_TEMP/fuzz-${{ matrix.target }}.log"
          summary_file="$RUNNER_TEMP/fuzz-${{ matrix.target }}.summary"
          mkdir -p "$artifact_dir"
          set -o pipefail
          cargo fuzz run "${{ matrix.target }}" -- \
            -runs=1000 \
            -timeout=5 \
            -print_final_stats=1 \
            -artifact_prefix="$artifact_dir/" 2>&1 | tee "$log_file"
          if find "$artifact_dir" -type f -print -quit | grep -q .; then
            echo "findings=1" | tee "$summary_file"
            exit 1
          fi
          echo "findings=0" | tee "$summary_file"

      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.log
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.summary
            ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: error
