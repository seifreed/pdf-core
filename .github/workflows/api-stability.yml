name: API Stability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  semver:
    name: Compare public API with pdf-ast 0.1.0 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-01-01
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-semver-checks.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "52a65dc88dc53fa8b57d6087954eb52cda149ca03bcfca78ce3fdecd23f893c4  $archive" | sha256sum --check
          install_dir="$RUNNER_TEMP/cargo-semver-checks"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check release compatibility
        run: cargo semver-checks check-release --package pdf-ast --baseline-version 0.1.0
