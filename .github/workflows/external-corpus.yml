name: External PDF Corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

jobs:
  verapdf-corpus:
    name: veraPDF corpus smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2024-01-01
        with:
          toolchain: stable

      - name: Fetch pinned project corpus
        env:
          PDF_CORPUS_COMMIT: 9979a2a8618dcdf23ad3f20c760c1f06e5b36fe6
        run: tools/fetch-verapdf-corpus.sh "fixtures" "$RUNNER_TEMP/verapdf-corpus"

      - name: Run panic regression test
        env:
          PDF_EXTERNAL_CORPUS: ${{ runner.temp }}/verapdf-corpus
          PDF_VERAPDF_CORPUS: ${{ runner.temp }}/verapdf-corpus/verapdf-pdfa-1b
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: cargo test --test external_corpus_tests --locked -- --test-threads=1

      - name: Run veraPDF comparison
        env:
          PDF_VERAPDF_CORPUS: ${{ runner.temp }}/verapdf-corpus/verapdf-pdfa-1b
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: cargo test --test verapdf_tests --locked -- --test-threads=1
