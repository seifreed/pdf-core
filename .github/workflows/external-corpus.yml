name: External PDF Corpus

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verapdf-corpus:
    name: veraPDF corpus smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-01-01
        with:
          toolchain: stable

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned veraPDF CLI
        env:
          VERAPDF_SHA256: 6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838
        run: |
          archive="$RUNNER_TEMP/verapdf-1.30.2.zip"
          curl --fail --location --retry 3 \
            https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip \
            --output "$archive"
          echo "$VERAPDF_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/verapdf-install.xml" <<'EOF'
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>${{ runner.temp }}/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-1.30.2/verapdf-install" \
            "$RUNNER_TEMP/verapdf-install.xml"
          test -x "$RUNNER_TEMP/verapdf/verapdf"
          echo "VERAPDF_BIN=$RUNNER_TEMP/verapdf/verapdf" >> "$GITHUB_ENV"

      - name: Fetch pinned project corpus
        env:
          PDF_CORPUS_COMMIT: 344a1c906b158568f47af5f5e9ee8371dddc30c7
        run: tools/fetch-verapdf-corpus.sh "fixtures" "$RUNNER_TEMP/verapdf-corpus"

      - name: Run panic regression test
        env:
          PDF_EXTERNAL_CORPUS: ${{ runner.temp }}/verapdf-corpus
          PDF_VERAPDF_CORPUS: ${{ runner.temp }}/verapdf-corpus/verapdf-pdfa-1b
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/external-corpus.resources" \
            cargo test --test external_corpus_tests --locked -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/external-corpus.log"

      - name: Run veraPDF comparison
        env:
          PDF_VERAPDF_CORPUS: ${{ runner.temp }}/verapdf-corpus/verapdf-pdfa-1b
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: cargo test --test verapdf_tests --locked -- --test-threads=1

      - name: Run rule coverage checks
        env:
          PDF_COMPLIANCE_CORPUS: ${{ runner.temp }}/verapdf-corpus
          PDF_EXTERNAL_CORPUS: ${{ runner.temp }}/verapdf-corpus
          PDF_EXTERNAL_MAX_FILES: "3000"
        run: cargo test --test verapdf_rule_mapping_tests --locked -- --test-threads=1

      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-corpus-evidence
          path: |
            ${{ runner.temp }}/external-corpus.log
            ${{ runner.temp }}/external-corpus.resources
          if-no-files-found: error
